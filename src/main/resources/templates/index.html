<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>miniSQL</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <header>
        <h1>miniSQL</h1>
    </header>
    <main>
        <form method="post" th:action="@{/query}">
            <textarea name="sql" th:text="${sql}" placeholder="SELECT * FROM users WHERE age > 25 ORDER BY name LIMIT 10" spellcheck="false"></textarea>
            <button type="submit">Run</button>
        </form>

        <details class="examples">
            <summary>Example statements</summary>
            <form method="post" th:action="@{/query}">
                <button type="submit" name="sql" value="CREATE TABLE users (id INTEGER, name TEXT, age INTEGER)">Create a table</button>
                <button type="submit" name="sql" value="INSERT INTO users VALUES (1, 'Alice', 30)">Insert a row</button>
                <button type="submit" name="sql" value="SELECT * FROM users">Select all rows</button>
                <button type="submit" name="sql" value="SELECT * FROM users WHERE age &gt; 25">Filter with WHERE</button>
                <button type="submit" name="sql" value="UPDATE users SET age = 31 WHERE id = 1">Update a row</button>
                <button type="submit" name="sql" value="DELETE FROM users WHERE id = 1">Delete a row</button>
                <button type="submit" name="sql" value="DROP TABLE users">Drop the table</button>
            </form>
        </details>

        <div class="panels">
            <aside>
                <h2>Tables</h2>
                <ul>
                    <li th:each="t : ${tables}" th:text="${t}"></li>
                </ul>
            </aside>

            <section class="results">
                <h2>Results</h2>

                <div class="error" th:if="${error}" th:text="${error}"></div>

                <div th:if="${columns}">
                    <div class="status" th:text="${rows.size()} + ' row(s) in ' + ${elapsedMs} + 'ms'"></div>
                    <table>
                        <thead>
                            <tr><th th:each="col : ${columns}" th:text="${col}"></th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="row : ${rows}">
                                <td th:each="col : ${columns}" th:text="${row.get(col)}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div class="status" th:if="${affectedRows != null}" th:text="${affectedRows} + ' row(s) affected in ' + ${elapsedMs} + 'ms'"></div>
            </section>
        </div>
    </main>
</body>
</html>
